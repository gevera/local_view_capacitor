<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="csrf-token" content="not-needed" />
    <title>Report submissions · Local View</title>
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body>
    <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
      <header class="mb-8 border-b border-base-300 pb-6">
        <p class="mb-2 text-sm text-base-content/60">Local First</p>
        <h1 class="text-3xl font-bold tracking-tight">Report submissions</h1>
        <p class="mt-3 text-base-content/70">
          Capture reports wherever you are. Keep working, even without a connection.
        </p>
      </header>
      <main>
        <div>
          <div
            data-pop-view="ReportsLocal"
            id="reports-local"
            phx-hook="LocalLiveView"
            data-pop-mirror-token=""
            data-pop-mirror-id=""
            data-pop-assigns="{}"
            phx-update="ignore"
          ></div>
          <div id="reports-local-llv-event-bus" data-llv-event-bus-for="reports-local" phx-hook="LocalLiveViewEventBus" hidden></div>
        </div>
      </main>
      <footer class="mt-10 border-t border-base-300 pt-4 text-sm text-base-content/60">
        Saved reports stay on this device and sync automatically when the server is reachable.
      </footer>
    </div>
    <noscript>This application needs JavaScript to run Elixir locally and save reports offline.</noscript>
  </body>
</html>
